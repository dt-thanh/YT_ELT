# =============================================================================
# pyproject.toml - KHAI BÁO package, thay cho việc chống PYTHONPATH bằng tay.
#
# VẤN ĐỀ NÓ GIẢI:
#   trước: PYTHONPATH=src ./venv/bin/python -m youtube_intel.cli ...
#          -> phải nhớ gõ ở MỌI chỗ; quên là ModuleNotFoundError
#          -> không có gì khai thư viện nào cần -> venv trôi dạt
#             (đã gặp thật ở Bước 4: `tenacity` tự biến mất khỏi venv)
#   sau:   pip install -e .   ->   import youtube_intel chạy ở mọi nơi
#
# "src layout" (code nằm trong src/ thay vì ngay gốc repo) là chuẩn hiện nay.
# Lý do: khi chạy pytest ở gốc repo, Python KHÔNG tự thấy src/ -> buộc test
# phải import qua package ĐÃ CÀI, giống y hệt cách người dùng thật import.
# Nếu code nằm ở gốc, test sẽ import file cục bộ và bạn có thể quên khai
# một dependency mà vẫn thấy test xanh - rồi vỡ trên máy người khác.
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-intel"
version = "0.1.0"
description = "ELT pipeline thu thập và phân tích số liệu kênh YouTube"
requires-python = ">=3.10"

# Chỉ khai thư viện mà PACKAGE thực sự cần. KHÔNG khai airflow:
# youtube_intel không import airflow (ranh giới giữ từ Buổi 2) - Airflow chỉ là
# một trong nhiều cách gọi nó.
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "PyYAML>=6.0",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    # Agent inputs/outputs and LLM structured output (spec §7). Airflow 2.9 already ships it.
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Tách nhóm: ai chỉ chạy pipeline thì không phải cài streamlit/openai.
dashboard = ["streamlit>=1.30", "pandas>=2.0"]
llm = ["openai>=1.30"]
# Topic clustering (R-03): HDBSCAN from scikit-learn. The bge-m3 model needs
# sentence-transformers (pulls torch, ~2 GB) - kept separate until the owner decides
# where it runs (spec question Q6).
topics = ["scikit-learn>=1.3"]
embeddings = ["sentence-transformers>=2.7"]
# Comment analysis (R-04): language detection by a library, not an LLM.
comments = ["langdetect>=1.0.9"]
# Canon MCP server (C-04): python -m studio.mcp.canon_server
mcp = ["mcp>=2.3"]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
# Sau khi cài: gõ `youtube-intel status` thay vì `python -m youtube_intel.cli status`
youtube-intel = "youtube_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q gọn, --strict-markers chặn gõ sai tên marker (lỗi âm thầm hay gặp)
addopts = "-q --strict-markers"
markers = [
    "integration: cần database/MinIO thật (bỏ qua bằng: -m 'not integration')",
    "live: gọi API thật, TỐN QUOTA",
]
