# =============================================================================
# Canon sources (spec §9, C-01). Only `status: verified` sources are loaded.
#
# verified = year of publication, download URL and license checked against the
# source pages on 2026-11-02, with the evidence below. Vietnam rule used: author's /
# translator's life + 50 years (protection ends 31 Dec of the 50th year after death).
# This is a technical record, not legal advice; the owner confirms (see the report).
#
# Each source: how to fetch it, and how to cut it along its natural units
# (canon/chunk.py: heading levels as regexes). passage_id = <id>.<ref>.
# =============================================================================
sources:

  # ---------------------------------------------------------------- stoic -----
  - id: meditations.long1862
    work: Thoughts of Marcus Aurelius Antoninus (Meditations)
    work_vi: Suy tưởng
    author: Marcus Aurelius
    translator: George Long
    pub_year: 1862
    language: en
    pillar: stoic
    license: public_domain
    status: verified
    verified_on: 2026-11-02
    evidence:
      - "Gutenberg #15877 page: translator 'Long, George, 1800-1879'; 'Copyright: Public domain in the USA'."
      - "Not #2680: that file is Meric Casaubon's 1634 translation."
      - "VN life+50: Long died 1879 -> public domain."
    source_url: https://www.gutenberg.org/ebooks/15877
    fetch: [https://www.gutenberg.org/cache/epub/15877/pg15877.txt]
    parser:
      start_after: '^THE THOUGHTS$'
      end_before: '^INDEXES\.$'
      drop_indented: 4                     # translator's footnotes [A] ... are indented
      levels:
        - {name: book, pattern: '^([IVX]+)\.$', value: roman}
        - {name: item, pattern: '^(\d+)\. ', inline: true, implicit_first: true}
    ref_label: "Suy tưởng, quyển {book}, đoạn {item}"
    align: "meditations.{book}.{item}"

  - id: enchiridion.higginson1865
    work: The Enchiridion
    work_vi: Cẩm nang
    author: Epictetus
    translator: Thomas Wentworth Higginson
    pub_year: 1865
    language: en
    pillar: stoic
    license: public_domain
    status: verified
    verified_on: 2026-11-02
    evidence:
      - "Gutenberg #45109 page: translator 'Higginson, Thomas Wentworth, 1823-1911'; public domain in the USA."
      - "Translation first published 1865 (The Works of Epictetus). The scan is the 1948 Liberal Arts Press edition: its introduction by Albert Salomon is NOT loaded (start after 'THE ENCHIRIDION')."
      - "VN life+50: Higginson died 1911 -> public domain."
    source_url: https://www.gutenberg.org/ebooks/45109
    fetch: [https://www.gutenberg.org/cache/epub/45109/pg45109.txt]
    parser:
      start_after: '^\s*THE ENCHIRIDION\s*$'
      end_before: '^\s*Footnotes\s*$'
      levels:
        - {name: item, pattern: '^([IVXL]+)(?:\[\d+\])?$', value: roman}   # 'XXIX[2]'
    ref_label: "Cẩm nang, mục {item}"

  # ----------------------------------------------------------------- east -----
  - id: daodejing.legge1891
    work: The Tao Teh King
    work_vi: Đạo Đức Kinh
    author: Laozi
    translator: James Legge
    pub_year: 1891
    language: en
    pillar: east
    license: public_domain
    status: verified
    verified_on: 2026-11-02
    evidence:
      - "Gutenberg #216 page: translator 'Legge, James, 1815-1897'; public domain in the USA."
      - "Published 1891, Sacred Books of the East vol. 39 (archive.org wg939)."
      - "VN life+50: Legge died 1897 -> public domain."
    source_url: https://www.gutenberg.org/ebooks/216
    fetch: [https://www.gutenberg.org/cache/epub/216/pg216.txt]
    parser:
      start_after: '^PART 1\.$'
      strip_line_prefix: '^(?:Ch\. )?\d+\.\s*'     # verse numbers inside a chapter
      levels:
        - {name: ch, pattern: '^(?:Ch\. )?(\d+)\.(?:\s|$)', inline: true, after_blank_lines: 2}
    ref_label: "Đạo Đức Kinh, chương {ch}"
    align: "daodejing.{ch}"

  - id: analects.legge1861
    work: The Analects of Confucius
    work_vi: Luận Ngữ
    author: Confucius
    translator: James Legge
    pub_year: 1861
    language: en
    pillar: east
    license: public_domain
    status: verified
    verified_on: 2026-11-02
    evidence:
      - "Gutenberg #3330 page: translator Legge, James, 1815-1897; public domain in the USA."
      - "First published 1861, The Chinese Classics vol. 1."
      - "VN life+50: Legge died 1897 -> public domain."
    source_url: https://www.gutenberg.org/ebooks/3330
    fetch: [https://www.gutenberg.org/cache/epub/3330/pg3330.txt]
    parser:
      start_after: '^CONFUCIAN ANALECTS\.$'
      strip_line_prefix: '^\d+\.\s*'
      levels:
        - {name: book, pattern: '^BOOK ([IVXL]+)\.', value: roman}
        # The Gutenberg file has typos in chapter numerals (two 'CHAP. XVII.' in a row in
        # books II, III, V, IX, XIV): chapters are counted in order within each book.
        # Some headings also lack a period ('CHAP II.', 'CHAP. XVII The').
        - {name: ch, pattern: '^(?:CHAPTER|CHAP\.?)\s*[IVXL]+\.?\s+', value: sequence, inline: true}
    ref_label: "Luận Ngữ, thiên {book}, chương {ch}"
    align: "lunyu.{book}.{ch}"

  - id: artofwar.giles1910
    work: The Art of War
    work_vi: Binh pháp Tôn Tử
    author: Sun Tzu
    translator: Lionel Giles
    pub_year: 1910
    language: en
    pillar: east
    license: public_domain
    status: verified
    verified_on: 2026-11-02
    evidence:
      - "Gutenberg #17405 page: translator 'Giles, Lionel, 1875-1958'; 'Original Publication: 1910'; public domain in the USA."
      - "VN life+50: Giles died 1958 -> public domain since 2009."
    source_url: https://www.gutenberg.org/ebooks/17405
    fetch: [https://www.gutenberg.org/cache/epub/17405/pg17405.txt]
    parser:
      start_after: 'CHAPTER XIII\. THE USE OF SPIES'      # last line of the contents
      levels:
        - {name: ch, pattern: '^([IVXL]+)\. [A-Z]', value: roman}
        - {name: verse, pattern: '^(\d+)(?:, (\d+))?\. ', inline: true, range_group: 2}   # Giles merges: '5, 6.'
    ref_label: "Binh pháp Tôn Tử, thiên {ch}, câu {verse}"
    align: "sunzi.{ch}"                     # Chinese paragraphs != Giles verses: align by chapter

  # ---------------------------------------------------------------- fable -----
  - id: aesop.townsend1867
    work: Three Hundred Aesop's Fables
    work_vi: Ngụ ngôn Aesop
    author: Aesop
    translator: George Fyler Townsend
    pub_year: 1867
    language: en
    pillar: fable
    license: public_domain
    status: verified
    verified_on: 2026-11-02
    evidence:
      - "Gutenberg #21 page: translator 'Townsend, George Fyler, 1814-1900'; public domain in the USA."
      - "Published 1867 (Wikisource author page)."
      - "VN life+50: Townsend died 1900 -> public domain."
    source_url: https://www.gutenberg.org/ebooks/21
    fetch: [https://www.gutenberg.org/cache/epub/21/pg21.txt]
    parser:
      start_after: '^AESOP’S FABLES$'
      end_before: '^FOOTNOTES$'
      levels:
        - {name: fable, pattern: '^([A-Z][^.!?“”"]{2,80})$', value: sequence, title_group: 1,
           after_blank_lines: 3}
    ref_label: "Ngụ ngôn Aesop, truyện {fable}: {title}"

