      - https://en.wikisource.org/w/index.php?title=Moral_letters_to_Lucilius/Letter_124&action=render
    format: html
    parser:
      fetch_heading: "LETTER {n}"
      drop_lines: '^\s*↑'                 # footnotes (letter 87 has no closing Farewell)
      replace:
        # navigation and title; never past the next page, titles may hold a <sup> footnote
        - ['(?s)(LETTER \d+\n\n)(?:(?!\nLETTER \d+\n).)*?<p[^>]*>\s*[IVXLC]+\.\s(?:(?!</p>).)*</p>', "\\1"]
        - ['(?s)(Farewell\.)(?:(?!Farewell\.).)*?(?=\nLETTER \d+\n|\Z)', "\\1"]   # footnotes after the last Farewell
        # Loeb section numbers: <span class="wst-verse ..." id="6."><sup><b>6.</b></sup></span>
        - ['(?s)<span class="wst-verse[^"]*" id="(\d+)\.">.*?</span>', "\n\n§\\1 "]
