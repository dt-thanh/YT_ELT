  - id: debrevitate.latin
    work: De Brevitate Vitae
    work_vi: Về sự ngắn ngủi của đời người
    author: Seneca
    translator: null
    pub_year: 49                          # approximate date of composition (AD)
    language: la
    pillar: stoic
    license: public_domain
    status: verified
    verified_on: 2026-11-02
    evidence:
      - "Ancient text (Seneca, c. AD 49): public domain everywhere. The Latin Library page carries no copyright claim."
      - "Basore's English (Loeb Moral Essays vol. II, 1932) is NOT used: printed in Great Britain, possible URAA restoration in the US until 2027."
    source_url: https://www.thelatinlibrary.com/sen/sen.brevita.shtml
    fetch: [https://www.thelatinlibrary.com/sen/sen.brevita.shtml]
    format: html
    parser:
      replace:
        - ['(?s)<table.*?(?=\nLIBER \d|\Z)', ""]          # site navigation footer (no </table>)
        # source quirks: 'XVII<tab>I Ipsae' (section 1 as a letter), 'XIII' without a period
        - ['<p>\s*XVII\s+I\s', "<p>XVII.\n\n§1 "]
        - ['<span style="font-size: 80%;">(\d+)</span>', "\n\n§\\1 "]
        - ['<p>\s*([IVXL]+)\.?(?=\s)', "<p>\\1.\n\n"]
      start_after: 'DE BREVITATE VITAE'
      levels:
        - {name: ch, pattern: '^([IVXL]+)\.$', value: roman}
        - {name: sec, pattern: '^§(\d+) ', inline: true}
    ref_label: "Về sự ngắn ngủi của đời người, chương {ch}, đoạn {sec} (nguyên văn Latin)"

