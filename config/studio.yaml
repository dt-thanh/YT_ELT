# =============================================================================
# YT_ELT Studio - cấu hình studio (đặc tả mục 11). Đi vào git; không chứa secret.
# Các khối khác (style guide, trần chi phí, định tuyến model) thêm ở các giai đoạn sau.
# =============================================================================

# Tìm kênh ỨNG VIÊN bằng `youtube-intel suggest-channels` (R-01). Mỗi câu = 1 lần gọi
# search.list (bucket riêng, 100 lần/ngày). Kết quả chỉ là ĐỀ XUẤT trong proposals/;
# người chốt danh sách rồi mới chép vào config/channels.yaml.
# Mục tiêu đặc tả mục 5: tiếng Anh 25-35 kênh, tiếng Trung 15-25, tiếng Việt 15-25;
# còn hoạt động trong 60 ngày; có cả kênh lớn lẫn kênh nhỏ.
channel_search:
  active_within_days: 60
  results_per_query: 25
  queries:
    - {pillar: stoic, language: en, query: "stoicism"}
    - {pillar: stoic, language: en, query: "stoic philosophy marcus aurelius"}
    - {pillar: stoic, language: en, query: "seneca letters philosophy"}
    - {pillar: stoic, language: zh, query: "斯多葛 哲學"}
    - {pillar: stoic, language: vi, query: "chủ nghĩa khắc kỷ"}
    - {pillar: stoic, language: vi, query: "triết lý khắc kỷ"}
    - {pillar: east,  language: en, query: "tao te ching explained"}
    - {pillar: east,  language: en, query: "zhuangzi philosophy"}
    - {pillar: east,  language: en, query: "confucius analects"}
    - {pillar: east,  language: zh, query: "道德經 解讀"}
    - {pillar: east,  language: zh, query: "莊子 故事"}
    - {pillar: east,  language: zh, query: "論語 智慧"}
    - {pillar: east,  language: vi, query: "đạo đức kinh lão tử"}
    - {pillar: east,  language: vi, query: "triết lý phương đông"}
    - {pillar: fable, language: en, query: "aesop fables"}
    - {pillar: fable, language: en, query: "fables and moral stories for adults"}
    - {pillar: fable, language: zh, query: "寓言故事"}
    - {pillar: fable, language: zh, query: "成語故事"}
    - {pillar: fable, language: vi, query: "truyện ngụ ngôn"}
    - {pillar: fable, language: vi, query: "truyện cổ tích việt nam"}

# Tín hiệu S1-S3 (đặc tả mục 8.1, R-02). CHỈ tính khi derived_metrics_enabled = true.
# Ngưỡng ban đầu là giá trị đoán (đặc tả); hiệu chỉnh ở A-03 bằng kết quả thật.
signals:
  window_days: 60              # tính tín hiệu cho video đăng trong 60 ngày gần nhất
  short_max_seconds: 180       # <= 180 giây coi là Short (heuristic, lưu format_guess)
  s1_ages_days: [2, 7, 28]     # so cùng tuổi; dùng tuổi lớn nhất video đã đạt và có snapshot
  age_tolerance_hours: 12      # snapshot "ở tuổi a" = quan sát cách mốc a tối đa 12 giờ
  peers_max: 20                # tối đa 20 video gần nhất cùng kênh, cùng định dạng
  peers_min: 5                 # ít hơn -> baseline_approx
  approx_age_days: [7, 60]     # baseline_approx: trung vị view hiện tại của video 7-60 ngày tuổi
  s1_outstanding: 2.0          # "nổi trội" (chỉ khi baseline đầy đủ)
  s1_very_outstanding: 5.0     # "rất nổi trội"
  s2_window_hours: [24, 72]    # tốc độ trong 24-72 giờ đầu
  s2_gap_hours: [18, 30]       # hai quan sát cách nhau 18-30 giờ (như v_video_growth)

# Cụm chủ đề và S4-S6 (đặc tả mục 8.2, R-03). CHỈ khi derived_metrics_enabled = true.
# ⚠️ Developer Policies III.E.2 chỉ cho gộp dữ liệu của các kênh CÙNG chủ sở hữu nội dung;
# S4 đếm số kênh KHÁC nhau trong một cụm - xem docs/policy_notes.md trước khi bật.
topics:
  embedding_model: BAAI/bge-m3   # đa ngôn ngữ EN/ZH/VI, chạy cục bộ (không tốn API)
  text_chars: 300                # tiêu đề + đầu mô tả
  window_days: 90                # video đưa vào gom cụm
  min_cluster_size: 3            # HDBSCAN
  rising_days: 14                # S4: trong 14 ngày...
  rising_min_channels: 3         # ...ít nhất 3 kênh khác nhau...
  rising_min_s1: 2.0             # ...mỗi kênh >= 1 video S1 >= 2 với baseline đầy đủ
  gap_max_vi_videos: 2           # S5: cụm đang lên ở EN/ZH, < 2 video tiếng Việt trong 90 ngày
  saturation_min_vi_videos: 4    # S6: nhiều video tiếng Việt mới mà S1 trung vị giảm dần

# Gateway (đặc tả mục 12): MỌI lời gọi LLM của studio đi qua đây. Định tuyến việc -> model,
# ghi chi phí từng lần gọi vào llm_calls (job_id, agent), và TỪ CHỐI trước khi gọi nếu
# chi phí tối đa có thể của lần gọi làm job vượt trần. Giá lấy từ llm_pricing trong
# channels.yaml; model không có giá thì bị từ chối (không chặn được chi phí).
gateway:
  models:
    cheap: gpt-4o-mini           # phân loại, nghiên cứu, báo cáo
    # good: <chọn ở P3>          # kịch bản, kiểm định (Checker khác model Writer nếu được)
  routes:                        # việc -> tầng model + số token ra tối đa
    classify_comments:    {tier: cheap, max_output_tokens: 1500}
    paraphrase_questions: {tier: cheap, max_output_tokens: 800}
    name_clusters:        {tier: cheap, max_output_tokens: 300}
    research_brief:       {tier: cheap, max_output_tokens: 2000}
    market_report:        {tier: cheap, max_output_tokens: 1500}
  budget_usd:
    short: 3.0                   # trần mỗi job Short (đặc tả mục 2)
    long: 10.0                   # trần mỗi job video dài
    standalone: 0.5              # lượt chạy không thuộc video nào (nghiên cứu, bản tin, bình luận)
    # monthly: <Q1 chưa chốt>    # trần tháng toàn hệ thống - để trống = không có trần tháng
  chars_per_token: 3             # ước token đầu vào THẬN TRỌNG (thực tế ~4 ký tự/token)

# Phân tích bình luận (đặc tả mục 8.3, R-04). CHỈ khi derived_metrics_enabled = true.
# R8: không lưu tên hiển thị; ID tác giả băm một chiều (HMAC, khóa COMMENT_AUTHOR_KEY
# trong .env); không trích nguyên văn bình luận vào video.
comments:
  comment_rate_min: 0.005        # ngoài video "nổi trội", lấy cả video comment/view >= 0,5 %
  max_videos_per_run: 30         # 1 unit / video (commentThreads, bucket chung)
  per_video: 100                 # order = relevance
  refresh_days: 7                # không lấy lại video đã lấy trong 7 ngày
  classify_batch: 25             # bình luận mỗi lần gọi model rẻ
  min_question_cluster: 2        # câu hỏi/yêu cầu gom cụm cần >= 2 bình luận
