# Retrieval evaluation queries for `youtube-intel eval-rag`.
#
# Each query lists the video ids a person judged RELEVANT. Labels are human
# decisions: fill `relevant` yourself. To speed this up,
#   youtube-intel eval-rag --suggest
# writes candidate videos for every query whose `relevant` is empty; review them
# and copy the ids that truly match here. Queries with an empty list are skipped,
# unless `expect_no_results: true`: then search should return no_relevant_results
# (that is what min_similarity controls).
#
# Labels of 2026-10-31: proposed by Claude after reading all 288 titles in elt_db,
# accepted by the owner. q24 ("video tổng hợp nhiều tập") was dropped: the
# boilerplate description of every Heo Peppa video says "nhiều tập và phần tổng hợp".
# ⚠️ R3: videos older than api_data_retention_days are deleted from the database,
# so labels slowly point at videos that no longer exist and recall drifts down.
# Re-label (or re-run --suggest) when that happens; compare runs only on the same date.
#
# Mix on purpose: Vietnamese with accents, without accents, and English, because
# the two search modes fail differently on each (full-text needs the words,
# vector search needs the meaning).
queries:
