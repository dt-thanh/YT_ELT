# Retrieval evaluation queries for `youtube-intel eval-rag`.
#
# Each query lists the video ids a person judged RELEVANT. Labels are human
# decisions: fill `relevant` yourself. To speed this up,
#   youtube-intel eval-rag --suggest
# writes candidate videos for every query whose `relevant` is empty; review them
# and copy the ids that truly match here. Queries with an empty list are skipped.
#
# Mix on purpose: Vietnamese with accents, without accents, and English, because
# the two search modes fail differently on each (full-text needs the words,
# vector search needs the meaning).
queries:
