  start: 孔子圍於陳、蔡之間，七日不火食。太公任往弔之，曰：「子幾死乎？」曰：「然。」「子惡死乎？」曰：「然。」任曰：「予嘗言不死之道。東海有鳥焉，其名曰意怠。其爲鳥也，翂翂翐翐，而似无能，引援而飛，迫脅而棲，進不敢爲前，退不敢爲後，食不敢先嘗，必取其緒，是故其行列不斥，而外人卒不得害，是以免於患。直木先伐，甘井先竭。子其意者，飾知以驚愚，脩身以明汙，昭昭乎如揭日月而行，故不免也。昔吾聞之大成之人曰：『自伐者无功，功成者墮，名成者虧。』孰能去功與名，而還與衆人？道流而不明居，得行而不名
  ref_label_correct: null
