# ============================================================================
# TỔNG QUAN FILE NÀY (đọc trước khi đọc chi tiết):
#
# File này là "nhạc trưởng" - bạn chỉ chạy 1 lệnh: docker compose up
# Nó sẽ dựng toàn bộ hệ thống gồm các container:
#   - postgres  : 1 container chứa 3 database (metadata, celery, elt)
#   - redis     : hàng đợi giao việc giữa scheduler và worker
#   - minio     : data lake - nơi chứa raw JSON      [THÊM MỚI so với khóa]
#   - airflow-* : dàn Airflow (webserver, scheduler, worker, init)
#
# Các dấu ${...} là biến, được đọc từ file .env đặt cạnh file này.
# ============================================================================
---
# ----------------------------------------------------------------------------
# KHỐI DÙNG CHUNG (YAML anchor):
# "&airflow-common" = đặt tên cho cả cục cấu hình này.
# Ở dưới, các service Airflow chỉ cần viết "<<: *airflow-common"
# là dán nguyên cục này vào - viết 1 lần, dùng cho 4 container Airflow (DRY).
# ----------------------------------------------------------------------------
x-airflow-common:
  &airflow-common
  # Image Airflow TỰ BUILD từ Dockerfile của bạn (đã cài soda, pytest, boto3),
  # tên image ghép từ .env -> vd: dt-thanh/yt_api_elt:latest
  # Lần đầu phải build thủ công: docker build -t dt-thanh/yt_api_elt:latest .
  image: ${DOCKERHUB_NAMESPACE}/${DOCKERHUB_REPOSITORY}:latest
  # Use the .env file to read the connection params and variables - SWITCH THIS OFF WHEN USING GITHUB ACTIONS
  # env_file:
  #   - .env
  environment:
    &airflow-common-env
    # Dùng CeleryExecutor: scheduler giao việc qua Redis, worker nhận và chạy
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    # Airflow nối vào database metadata (sổ sách nội bộ: lịch sử chạy, XCom...)
    # Chú ý host là "postgres" = TÊN SERVICE trong file này, không phải localhost
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${METADATA_DATABASE_USERNAME}:${METADATA_DATABASE_PASSWORD}@${POSTGRES_CONN_HOST}:${POSTGRES_CONN_PORT}/${METADATA_DATABASE_NAME}
    # Nơi Celery lưu kết quả task (database thứ 2 trong 3 database)
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${CELERY_BACKEND_USERNAME}:${CELERY_BACKEND_PASSWORD}@${POSTGRES_CONN_HOST}:${POSTGRES_CONN_PORT}/${CELERY_BACKEND_NAME}
    # "Băng chuyền" Redis: scheduler thả task vào đây, worker nhặt ra chạy
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    # Khóa mã hóa secret (Connection/Variable) lưu trong metadata db
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    # DAG mới tạo sẽ ở trạng thái TẠM DỪNG - vào UI phải gạt công tắc bật!
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # Không nạp mấy chục DAG ví dụ của Airflow cho đỡ rối UI
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Cách xác thực khi gọi API của Airflow
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # Bật endpoint health check cho scheduler (healthcheck ở dưới dùng nó)
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # ------------------------------------------------------------------
    # QUY ƯỚC QUAN TRỌNG NHẤT FILE NÀY:
    # Biến môi trường bắt đầu bằng AIRFLOW_CONN_xxx -> thành Connection "xxx"
    # Biến môi trường bắt đầu bằng AIRFLOW_VAR_xxx  -> thành Variable "xxx"
    # Đây chính là lý do code Python đọc được Variable.get("API_KEY")!
    # (Chúng KHÔNG hiện trên UI, nhưng Variable.get()/Connection vẫn đọc được)
    # ------------------------------------------------------------------
    # Connection tới database elt_db - Module 2 (load vào Postgres) sẽ dùng
    # trong code với conn_id="postgres_db_yt_elt"
    AIRFLOW_CONN_POSTGRES_DB_YT_ELT: 'postgresql://${ELT_DATABASE_USERNAME}:${ELT_DATABASE_PASSWORD}@${POSTGRES_CONN_HOST}:${POSTGRES_CONN_PORT}/${ELT_DATABASE_NAME}'
    # Hai Variable mà video_stats.py đang đọc:
    # Variable.get("API_KEY") và Variable.get("CHANNEL_HANDLE")
    AIRFLOW_VAR_API_KEY: ${API_KEY}
    AIRFLOW_VAR_CHANNEL_HANDLE: ${CHANNEL_HANDLE}
    ### [THÊM MỚI - MinIO] 3 Variable cho task save_to_minio:
    ### Variable.get("MINIO_ENDPOINT") / ("MINIO_ACCESS_KEY") / ("MINIO_SECRET_KEY")
    ### Giá trị lấy từ .env (nhớ thêm 3 dòng MINIO_* vào .env!)
    AIRFLOW_VAR_MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    AIRFLOW_VAR_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    AIRFLOW_VAR_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    # Các biến trần (không tiền tố) cho integration test / data quality test
    ELT_DATABASE_NAME: ${ELT_DATABASE_NAME}
    ELT_DATABASE_USERNAME: ${ELT_DATABASE_USERNAME}
    ELT_DATABASE_PASSWORD: ${ELT_DATABASE_PASSWORD}
    POSTGRES_CONN_HOST: ${POSTGRES_CONN_HOST}
    POSTGRES_CONN_PORT: ${POSTGRES_CONN_PORT}
  # Mount thư mục máy bạn <-> trong container:
  # sửa file dags/ trên máy là container thấy NGAY, không cần build lại image
  volumes:
    - ./config:/opt/airflow/config
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./include:/opt/airflow/include
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
  # Chạy bằng UID từ .env để file log/dags không bị root chiếm quyền
  user: "${AIRFLOW_UID}:0"
  # Mọi container Airflow phải ĐỢI redis + postgres KHỎE mới khởi động
  # ("khỏe" = qua được healthcheck, không phải chỉ "đã bật")
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ==========================================================================
  # POSTGRES - 1 container, 3 database (metadata / celery / elt)
  # ==========================================================================
  postgres:
    container_name: postgres
    image: postgres:13
    # Use the .env file to read the connection params - SWITCH THIS OFF WHEN USING GITHUB ACTIONS
    # env_file:
    #   - .env
    # Env vars after POSTGRES_PASSWORD are needed for CI-CD workflow - SWITCH THIS ALL ON WHEN USING GITHUB ACTIONS
    environment:
      # 2 biến đầu là của image postgres: tạo user siêu quyền
      - POSTGRES_USER=${POSTGRES_CONN_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_CONN_PASSWORD}
      # Các biến dưới đây được bơm vào để init-multiple-databases.sh đọc
      # (script dùng $METADATA_DATABASE_NAME, $ELT_DATABASE_NAME... để tạo 3 db)
      - METADATA_DATABASE_NAME=${METADATA_DATABASE_NAME}
      - METADATA_DATABASE_USERNAME=${METADATA_DATABASE_USERNAME}
      - METADATA_DATABASE_PASSWORD=${METADATA_DATABASE_PASSWORD}
      - ELT_DATABASE_NAME=${ELT_DATABASE_NAME}
      - ELT_DATABASE_USERNAME=${ELT_DATABASE_USERNAME}
      - ELT_DATABASE_PASSWORD=${ELT_DATABASE_PASSWORD}
      - CELERY_BACKEND_NAME=${CELERY_BACKEND_NAME}
      - CELERY_BACKEND_USERNAME=${CELERY_BACKEND_USERNAME}
      - CELERY_BACKEND_PASSWORD=${CELERY_BACKEND_PASSWORD}
      - POSTGRES_CONN_HOST=${POSTGRES_CONN_HOST}
      - POSTGRES_CONN_PORT=${POSTGRES_CONN_PORT}
    ports:
      - 5432:5432
    volumes:
      # Volume giữ dữ liệu sống sót khi container tắt/bật
      - postgres-db-volume:/var/lib/postgresql/data
      # "Dán tờ giấy dặn dò vào bếp": mount script vào thư mục đặc biệt,
      # Postgres TỰ chạy nó 1 LẦN DUY NHẤT lúc volume còn trống.
      # Sửa script xong muốn chạy lại phải xóa volume: docker compose down -v
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    # Định nghĩa thế nào là "khỏe": pg_isready trả lời OK
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_CONN_USERNAME}", "-d", "${METADATA_DATABASE_NAME}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ==========================================================================
  # REDIS - hàng đợi (message broker) giữa scheduler và worker
  # ==========================================================================
  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    container_name: redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # ==========================================================================
  # ### [THÊM MỚI] MINIO - DATA LAKE (object storage tương thích S3)
  # Task save_to_minio đẩy raw JSON vào đây, partition theo ngày.
  # Code dùng boto3 (thư viện S3) nên sau này lên AWS chỉ đổi endpoint.
  # ==========================================================================
  minio:
    image: minio/minio
    container_name: minio
    # server /data = chạy MinIO, dữ liệu chứa trong /data (đã mount volume)
    # --console-address ":9001" = giao diện web quản lý chạy cổng 9001
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"     # cổng API - boto3 trong code gọi vào đây
      - "9001:9001"     # cổng web console - mở localhost:9001 để XEM file
    environment:
      # Tài khoản đăng nhập MinIO, đọc từ .env
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      # Giữ dữ liệu lake sống sót khi container tắt/bật (giống postgres)
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always

  # ==========================================================================
  # DÀN AIRFLOW - 4 container dùng chung cục cấu hình *airflow-common
  # ==========================================================================
  # WEBSERVER - giao diện web tại localhost:8080
  airflow-webserver:
    <<: *airflow-common          # dán nguyên khối dùng chung vào đây
    command: webserver
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      # Đợi thêm: airflow-init phải CHẠY XONG TRÓT LỌT mới khởi động
      airflow-init:
        condition: service_completed_successfully

  # SCHEDULER - "bộ não": canh lịch, đến giờ thì thả task vào Redis
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow-scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # WORKER - "tay chân": nhặt task từ Redis và THỰC SỰ chạy code của bạn
  # (video_stats.py chạy ở trong container này!)
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    container_name: airflow-worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # airflow-triggerer:
  #   <<: *airflow-common
  #   command: triggerer
  #   container_name: airflow-triggerer
  #   healthcheck:
  #     test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   restart: always
  #   depends_on:
  #     <<: *airflow-common-depends-on
  #     airflow-init:
  #       condition: service_completed_successfully

  # INIT - chạy MỘT LẦN rồi thoát: kiểm tra RAM/CPU/disk đủ không,
  # tạo thư mục + phân quyền, migrate metadata db, tạo user đăng nhập web.
  # Khối bash dài ở dưới CHỈ là kiểm tra tài nguyên và in cảnh báo - đừng sợ!
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    container_name: airflow-init
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        mkdir -p /sources/dags /sources/data /sources/include /sources/logs /sources/tests
        chown -R "${AIRFLOW_UID}:0" /sources/{dags,data,include,logs,tests}
        exec /entrypoint airflow version
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      # Migrate (tạo bảng) cho metadata database
      _AIRFLOW_DB_MIGRATE: 'true'
      # Tạo tài khoản đăng nhập web UI, user/pass đọc từ .env
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"
    volumes:
      - .:/sources

  # CLI - công cụ debug, chỉ bật khi cần: docker compose --profile debug up
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow

  # # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # # See: https://docs.docker.com/compose/profiles/
  # flower:
  #   <<: *airflow-common
  #   command: celery flower
  #   container_name: airflow-celery-flower
  #   profiles:
  #     - flower
  #   ports:
  #     - "5555:5555"
  #   healthcheck:
  #     test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   restart: always
  #   depends_on:
  #     <<: *airflow-common-depends-on
  #     airflow-init:
  #       condition: service_completed_successfully

# Khai báo các volume "có tên" - nơi Docker giữ dữ liệu bền vững trên máy bạn
volumes:
  postgres-db-volume:
  minio-data:          ### [THÊM MỚI] volume cho MinIO - không có nó, tắt container là mất sạch data lake