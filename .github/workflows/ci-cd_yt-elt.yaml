# =============================================================================
# CI/CD - ba job, chạy từ RẺ đến ĐẮT, và chỉ PUBLISH khi mọi thứ đã xanh.
#
#   unit-tests ──► integration-tests ──► build-and-push
#   (30 giây,      (vài phút, dựng       (chỉ khi push lên main
#    không docker)  cả stack bằng docker)  VÀ hai job trước đều xanh)
#
# ⭐ SỬA LỖI NGHIÊM TRỌNG CỦA BẢN CŨ: bản cũ build & PUSH image lên DockerHub
# TRƯỚC, rồi mới test. Test đỏ thì image hỏng ĐÃ nằm trên registry rồi.
# Nguyên tắc: KHÔNG BAO GIỜ CÔNG BỐ THỨ CHƯA KIỂM TRA.
#
# ⭐ CI KHÔNG GỌI YOUTUBE API THẬT. Bản cũ chạy `airflow dags test` - nếu trỏ
# vào yt_collect thì MỖI LẦN PUSH đốt quota thật. Test ở đây dùng dữ liệu giả
# (unit) và database rỗng vừa dựng (integration). Brief §13: "Không gọi API
# thật cho mọi CI run."
# =============================================================================
name: CI-CD Pipeline

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Hai lần push liên tiếp vào cùng nhánh -> hủy lần chạy cũ, chỉ giữ lần mới.
# Không có dòng này, push 5 lần = 5 lần dựng cả stack Docker song song.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - unit test: NHANH, KHÔNG cần Docker. Hỏng ở đây thì dừng ngay,
  # không tốn vài phút dựng stack. Đây là "fail fast" ở tầng CI.
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài package + công cụ test
        run: pip install -e ".[dev,llm]"

      # -m "not integration": bỏ qua test cần database thật.
      # test_dags.py tự BỎ QUA vì runner không có airflow (importorskip).
      - name: Unit tests
        run: pytest -m "not integration" -q

  # ---------------------------------------------------------------------------
  # JOB 2 - dựng CẢ STACK bằng docker compose, chạy migration, chạy toàn bộ test
  # ---------------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      # ⭐ GIÁ TRỊ GIẢ, VIẾT THẲNG VÀO ĐÂY - KHÔNG dùng GitHub Secrets.
      #
      # Stack này chỉ SỐNG ~5 PHÚT trên một máy ảo dùng xong là hủy, không mở ra
      # internet. Mật khẩu ở đây KHÔNG BẢO VỆ GÌ - nên không cần là secret.
      # Dùng mật khẩu THẬT ở đây còn TỆ HƠN: đưa thông tin đăng nhập production
      # lên CI mà không được lợi gì.
      # Nguyên tắc: secret chỉ dành cho thứ THẬT SỰ cần bảo vệ
      # (ở đây: DOCKERHUB_PASSWORD, dùng ở job build-and-push).
      #
      # (Bản trước dùng secrets.* cho tất cả -> repo chỉ có 1/19 secret ->
      #  POSTGRES password rỗng -> Postgres thoát ngay -> CI đỏ sau 17 giây.)
      POSTGRES_CONN_USERNAME: ci_admin
      POSTGRES_CONN_PASSWORD: ci_admin_pw
      POSTGRES_CONN_HOST: postgres        # TÊN SERVICE trong compose
      POSTGRES_CONN_PORT: "5432"
      METADATA_DATABASE_NAME: airflow_metadata
      METADATA_DATABASE_USERNAME: ci_airflow
      METADATA_DATABASE_PASSWORD: ci_airflow_pw
      CELERY_BACKEND_NAME: airflow_celery
      CELERY_BACKEND_USERNAME: ci_celery
      CELERY_BACKEND_PASSWORD: ci_celery_pw
      ELT_DATABASE_NAME: elt_db
      ELT_DATABASE_USERNAME: ci_elt
      ELT_DATABASE_PASSWORD: ci_elt_pw
      AIRFLOW_WWW_USER_USERNAME: ci_admin
      AIRFLOW_WWW_USER_PASSWORD: ci_admin_pw
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ci_minio
      MINIO_SECRET_KEY: ci_minio_pw_123   # MinIO đòi tối thiểu 8 ký tự
      # Để TRỐNG có chủ ý: CI không được gọi YouTube hay OpenAI thật.
      API_KEY: ""
      OPENAI_API_KEY: ""
      AIRFLOW_UID: "50000"
      DOCKERHUB_NAMESPACE: ci
      DOCKERHUB_REPOSITORY: yt_api_elt
      # FERNET_KEY sinh NGẪU NHIÊN ở bước đầu (không viết cố định vào repo:
      # chuỗi trông giống khóa trong repo sẽ bị công cụ quét secret báo động).
    steps:
      - uses: actions/checkout@v4

      # Build LOCAL (không push). Tên image khớp DOCKERHUB_NAMESPACE/REPOSITORY
      # ở trên nên docker compose dùng thẳng image vừa build.
      # Fernet key = 32 byte ngẫu nhiên, mã hóa base64 kiểu URL-safe (44 ký tự).
      # $GITHUB_ENV: ghi vào đây thì mọi bước SAU trong job đều thấy biến này.
      - name: Sinh FERNET_KEY tạm
        run: echo "FERNET_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Build image (local, KHÔNG push)
        run: |
          docker build \
            --build-arg GIT_SHA=${GITHUB_SHA::7} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ci/yt_api_elt:latest .

      # --wait: đợi mọi service qua healthcheck rồi mới đi tiếp.
      # Không có nó, bước sau chạy khi Postgres chưa nhận kết nối -> lỗi ngẫu nhiên.
      - name: Dựng stack
        run: docker compose up -d --wait --wait-timeout 300

      # Database CI là database RỖNG vừa tạo -> phải chạy migration.
      # Đây cũng là bài kiểm tra: migration có chạy được từ số 0 không?
      - name: Chạy migration
        run: |
          for f in sql/migrations/*.sql; do
            echo "== $f"
            docker exec -i postgres psql -U "$ELT_DATABASE_USERNAME" \
              -d "$ELT_DATABASE_NAME" -v ON_ERROR_STOP=1 < "$f"
          done

      # Container là airflow-scheduler (không còn airflow-worker từ Bước 1).
      - name: Toàn bộ test (unit + DAG + integration)
        run: docker exec airflow-scheduler bash -lc "cd /opt/airflow && pytest tests/ -q"

      # Smoke test CLI - không gọi API, chỉ kiểm tra lệnh chạy được và nối được DB.
      - name: Smoke test CLI
        run: |
          docker exec airflow-scheduler bash -lc "cd /opt/airflow && python -m youtube_intel.cli status"
          docker exec airflow-scheduler bash -lc "cd /opt/airflow && python -m youtube_intel.cli retention"

      # if: failure() -> chỉ in log khi hỏng. Không có bước này, CI đỏ mà
      # không biết container nào chết vì sao.
      - name: Log khi hỏng
        if: failure()
        run: docker compose logs --tail=100

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # JOB 3 - PUBLISH. Chỉ chạy khi: push lên main VÀ hai job trước đều xanh.
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: integration-tests
    # Thêm điều kiện vars.DOCKERHUB_USERNAME: chưa cấu hình DockerHub thì BỎ QUA
    # job này (xám) thay vì báo ĐỎ. Đẩy image là tính năng TÙY CHỌN - không được
    # làm cả CI đỏ chỉ vì chưa thiết lập.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.DOCKERHUB_USERNAME != ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Hai tag: `latest` để dùng tiện, `<sha>` để ROLLBACK được về đúng commit.
      # Chỉ có `latest` thì image cũ bị đè mất -> không quay lại được.
      - name: Build & push
        run: |
          docker buildx build --push \
            --build-arg GIT_SHA=${GITHUB_SHA::7} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest \
            --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:${GITHUB_SHA::7} \
            .
